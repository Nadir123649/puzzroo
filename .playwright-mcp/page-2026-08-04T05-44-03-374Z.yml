            - heading "How To Play Medium Mode" [level=2] [ref=e452]
            - paragraph [ref=e60]: Advance to more detailed Nonogram images requiring deeper analysis. Apply intermediate logic when clues are less obvious and have multiple possible arrangements. Pay close attention to how numbers indicate groups separated by at least one empty cell. Track multiple possibilities mentally until you can definitively eliminate incorrect options. The revealed images become more intricate and satisfying. Develop your logical reasoning and pattern recognition skills.
