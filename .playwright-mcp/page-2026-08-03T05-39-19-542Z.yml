        - generic [ref=e560]:
          - heading "FAQs" [level=2] [ref=e562]
          - generic [ref=e563]:
            - button [ref=e564] [cursor=pointer]:
              - generic [ref=e565]:
                - heading "What is Puzzroo?" [level=3] [ref=e566]
                - img "Toggle" [ref=e568]
              - paragraph [ref=e570]: Puzzroo is a premium puzzle platform where you can play daily brain games like Sudoku, Nonograms, and logic challenges — all in one place and of course for free.
            - button [ref=e571] [cursor=pointer]:
              - generic [ref=e572]:
                - heading "Is it really free to play?" [level=3] [ref=e573]
                - img "Toggle" [ref=e575]
              - paragraph [ref=e577]: Yes! Puzzroo offers a completely free tier with access to all basic puzzle games. You can play as many games as you want without any cost. We also offer a Premium plan with additional features like ad-free experience, exclusive puzzles, and advanced statistics.
            - button [ref=e578] [cursor=pointer]:
              - generic [ref=e579]:
                - heading "Why should I register?" [level=3] [ref=e580]
                - img "Toggle" [ref=e582]
              - paragraph [ref=e584]: Registration allows you to save your progress, track your statistics, compete on leaderboards, and access your games across multiple devices. Plus, registered users get daily exclusive puzzles and can participate in special events and seasonal challenges.
            - button [ref=e585] [cursor=pointer]:
              - generic [ref=e586]:
                - heading "What's included in the Premium plan?" [level=3] [ref=e587]
                - img "Toggle" [ref=e589]
              - paragraph [ref=e591]: Premium members get unlimited access to all games, 100% ad-free experience, priority customer support, early access to new games, custom difficulty settings, progress tracking & stats, and access to exclusive brain training programs.
            - button [ref=e592] [cursor=pointer]:
              - generic [ref=e593]:
                - heading "Can I play without an internet connection?" [level=3] [ref=e594]
                - img "Toggle" [ref=e596]
              - paragraph [ref=e598]: Yes! Premium members can download puzzles for offline play. This feature allows you to enjoy your favorite brain games anytime, anywhere, even without an internet connection.
            - button [ref=e599] [cursor=pointer]:
              - generic [ref=e600]:
                - heading "Do you add new games regularly?" [level=3] [ref=e601]
                - img "Toggle" [ref=e603]
              - paragraph [ref=e605]: Absolutely! We regularly update our puzzle library with new games and variations. Premium members get early access to new releases, and we also run seasonal events with limited-time puzzle challenges.
            - button [ref=e606] [cursor=pointer]:
              - generic [ref=e607]:
                - heading "Can I cancel my subscription anytime?" [level=3] [ref=e608]
                - img "Toggle" [ref=e610]
              - paragraph [ref=e612]: Yes, you can cancel your Premium subscription at any time with no cancellation fees. Your Premium benefits will remain active until the end of your current billing period.
