            - heading "About Nonogram" [level=2] [ref=f7e56]
            - paragraph [ref=f7e57]: Nonogram is a picture logic puzzle where you reveal a hidden image by filling in cells according to number clues. Each number indicates a consecutive group of filled cells in that row or column. Combine logical reasoning with artistic discovery as beautiful pixel art emerges from your deductions.
          - generic [ref=f7e58]:
            - heading "How To Play Easy Mode" [level=2] [ref=f7e59]
            - paragraph [ref=f7e60]: Discover the joy of Nonogram picture puzzles! Start with rows and columns that have large numbers or only one or two groups. Mark cells as filled or empty based on the number clues provided. Cross-reference rows and columns to confirm your deductions. The completed puzzle reveals a recognizable pixel art image. Take your time learning the basic logic patterns. These beginner puzzles introduce you to the fundamental solving techniques.
